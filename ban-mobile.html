<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备不支持 - 《末日：幸存者》</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 覆盖 body 的背景，防止在手机端加载那个巨大的 370KB 图片 */
        body {
            background-image: none !important;
            background-color: #2b2b2b !important;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .warning-box {
            background-color: #c6c6c6;
            border: 4px solid #000;
            box-shadow: inset -4px -4px 0px #555, inset 4px 4px 0px #fff;
            padding: 30px 20px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .warning-box h2 {
            color: #d9534f;
            font-size: 24px;
            margin-top: 0;
            text-shadow: 2px 2px 0 #333;
        }
        .warning-box p {
            color: #333;
            font-size: 16px;
            font-family: 'MCUnifont', 'Microsoft YaHei', sans-serif;
            margin: 10px 0;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="warning-box">
        <h2>⚠️ 设备不支持</h2>
        <p>这是一个 Minecraft Java PC 整合包！</p>
        <p>它无法在移动端运行！请使用 PC 访问！</p>
    </div>
</body>
</html>
